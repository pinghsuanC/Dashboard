name: Build Check

permissions:
  contents: read          # the token can only read the repo

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # a new push cancels the PR's older run

on:
  pull_request:
    branches: [main]

jobs:
  # Labels every new PR automerge; remove the label before CI finishes to keep
  # the PR open. A label added with github.token starts no new run, which is
  # why the automerge job reads the labels itself instead of from the event.
  label:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add automerge label
        run: gh pr edit "$PR" --repo "$REPO" --add-label automerge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json   # reads engines.node
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
      
      - name: Check build & type check
        run: npm run build

      - name: Test
        run: npm run test
        
      - name: Audit dependencies
        # High and critical advisories in production dependencies fail the run,
        # except the reviewed ones allowlisted (with reasons) in audit-ci.jsonc.
        run: npx -y audit-ci@7.1.0 --config audit-ci.jsonc
    
    ## prisma checks
      - name: Prisma schema valid
        run: npx prisma validate

      - name: Prisma schema formatted
        run: npx prisma format --check

  # Merges the PR once every check job has passed, if it still has the
  # automerge label. Merging deploys to production and runs its migrations, so
  # a PR that adds one is left open to merge by hand.
  automerge:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # only this job may merge; build stays read-only
      pull-requests: write
    steps:
      - name: Merge PR
        run: |
          if ! gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name' | grep -qx automerge; then
            echo "::notice::No automerge label; leaving the PR open."
            exit 0
          fi
          if gh pr diff "$PR" --repo "$REPO" --name-only | grep -q '^prisma/migrations/'; then
            echo "::notice::PR adds a migration; merge it by hand."
            exit 0
          fi
          gh pr merge "$PR" --repo "$REPO" --merge --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}

