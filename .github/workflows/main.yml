name: Build Check

permissions:
  contents: read          # the token can only read the repo

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # a new push cancels the PR's older run

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json   # reads engines.node
          cache: npm
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm  

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
      
      - name: Check build & type check
        run: npm run build

      - name: Test
        run: npm run test
        
      - name: Audit dependencies
        run: npm audit --omit=dev
    
    ## prisma checks
      - name: Prisma schema valid
        run: npx prisma validate

      - name: Prisma schema formatted
        run: npx prisma format --check

