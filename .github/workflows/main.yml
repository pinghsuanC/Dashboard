name: Build Check

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        
      - name: Install dependencies
        run: npm ci

      - name: Check build
        run: npm run build

      - name: Test
        run: npm runt test
        
      - name: Audit dependencies
        run: npm audit --omit=dev

