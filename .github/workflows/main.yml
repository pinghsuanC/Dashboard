name: Build Check

permissions:
  contents: read          # the token can only read the repo

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # a new push cancels the PR's older run

on:
  pull_request:
    branches: [main]
    # labeled: adding the automerge label starts a run that can merge
    types: [opened, synchronize, reopened, labeled]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json   # reads engines.node
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
      
      - name: Check build & type check
        run: npm run build

      - name: Test
        run: npm run test
        
      - name: Audit dependencies
        # High and critical advisories in production dependencies fail the run,
        # except the reviewed ones allowlisted (with reasons) in audit-ci.jsonc.
        run: npx -y audit-ci@7.1.0 --config audit-ci.jsonc
    
    ## prisma checks
      - name: Prisma schema valid
        run: npx prisma validate

      - name: Prisma schema formatted
        run: npx prisma format --check

  # Merges a PR labeled automerge once every check job has passed. Merging
  # deploys to production and runs its migrations, so leave the label off a
  # PR with a migration and merge that one by hand.
  automerge:
    needs: [build]
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # only this job may merge; build stays read-only
      pull-requests: write
    steps:
      - name: Merge PR
        run: gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --merge --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}

